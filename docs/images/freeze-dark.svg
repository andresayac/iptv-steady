<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 552" width="960" height="552" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>A provider stall with and without IPTV Steady</title>
<desc>Line chart of playback position over 60 seconds. Through IPTV Steady the movie reaches 60 seconds without pausing, although the provider went silent at second 15 and was repaired by second 20. Directly from the provider, playback freezes at second 30 and never continues.</desc>
<rect x="0.5" y="0.5" width="959" height="551" rx="14" fill="#1a1a19" stroke="#2f2f2c"/>
<text x="76.0" y="48.0" font-size="26" font-weight="650" fill="#f0efec" text-anchor="start">The provider goes silent. Only one of these keeps playing.</text>
<text x="76.0" y="78.0" font-size="15.5" font-weight="400" fill="#c3c2b7" text-anchor="start">Two viewers, the same 8 Mbps movie, the same fault: the provider stops sending in the middle of the file.</text>
