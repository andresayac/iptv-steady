<text x="146.3" y="196.2" font-size="15" font-weight="600" fill="#f0efec" text-anchor="start">The same fault hits this viewer too.</text>
<text x="146.3" y="218.2" font-size="14.5" font-weight="400" fill="#c3c2b7" text-anchor="start">Noticed and repaired in 5 s at the exact byte,</text>
